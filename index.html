<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <div id="background"></div>
    <div class="overlay"></div>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <header>

        <div class="logo-container">
            <img id="logo" src="" alt="Logo">
            <span id="restaurant-name">Restaurant</span>
        </div>

        <nav>
            <a href="#home" data-i18n="home">Accueil</a>
            <a href="#menu" data-i18n="menu">Menu</a>
            <a href="#contact" data-i18n="contact">Contact</a>
        </nav>

        <div class="languages">

            <button onclick="changeLanguage('fr')">
                FR
            </button>

            <button onclick="changeLanguage('ar')">
                العربية
            </button>

            <button onclick="changeLanguage('en')">
                EN
            </button>

        </div>

    </header>


    <!-- =========================
         HOME
    ========================== -->

    <main>

        <section id="home" class="hero">

            <div class="hero-content">

                <h1 id="hero-title">
                    Bienvenue
                </h1>

                <p id="hero-description">
                    Découvrez notre menu.
                </p>

                <a href="#menu" class="main-button" data-i18n="viewMenu">
                    Voir le menu
                </a>

            </div>

        </section>


        <!-- =========================
             MENU
        ========================== -->

        <section id="menu" class="section">

            <h2 data-i18n="ourMenu">
                Notre Menu
            </h2>

            <div id="categories"></div>

            <div id="products"></div>

        </section>


        <!-- =========================
             CART
        ========================== -->

        <section id="cart" class="section cart-section">

            <h2 data-i18n="yourCart">
                Votre panier
            </h2>

            <div id="cart-items"></div>

            <div class="cart-total">

                <strong data-i18n="total">
                    Total
                </strong>

                <span id="cart-total">
                    0 DH
                </span>

            </div>

            <button
                class="main-button"
                onclick="orderViaWhatsApp()"
                data-i18n="order"
            >
                Commander
            </button>

        </section>


        <!-- =========================
             CONTACT
        ========================== -->

        <section id="contact" class="section">

            <h2 data-i18n="contactUs">
                Contactez-nous
            </h2>

            <p id="address"></p>

            <div class="contact-buttons">

                <a id="call-button"
                   class="main-button"
                   href="#">
                    📞 <span data-i18n="call">Appeler</span>
                </a>

                <a id="whatsapp-button"
                   class="main-button"
                   href="#"
                   target="_blank">
                    💬 WhatsApp
                </a>

                <a id="maps-button"
                   class="main-button"
                   href="#"
                   target="_blank">
                    📍 <span data-i18n="location">Localisation</span>
                </a>

            </div>

        </section>

    </main>


    <!-- =========================
         ADMIN
    ========================== -->

    <div id="admin-page" class="admin-page">

        <div class="admin-box">

            <button class="close-admin"
                    onclick="closeAdmin()">
                ✕
            </button>

            <h2>
                Admin
            </h2>

            <div id="login-area">

                <input
                    id="email"
                    type="email"
                    placeholder="Email"
                >

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                >

                <button onclick="login()">
                    Login
                </button>

            </div>


            <div id="admin-panel">

                <h3>Restaurant</h3>

                <input
                    id="admin-name"
                    placeholder="Restaurant name"
                >

                <input
                    id="admin-logo"
                    placeholder="Logo URL"
                >

                <input
                    id="admin-phone"
                    placeholder="Phone number"
                >

                <input
                    id="admin-whatsapp"
                    placeholder="WhatsApp number"
                >

                <input
                    id="admin-address"
                    placeholder="Address"
                >

                <input
                    id="admin-maps"
                    placeholder="Google Maps URL"
                >


                <h3>Background</h3>

                <input
                    id="admin-background"
                    placeholder="Background image URL"
                >

                <input
                    id="admin-video"
                    placeholder="Background video URL"
                >


                <h3>Text</h3>

                <input
                    id="admin-title-fr"
                    placeholder="French title"
                >

                <input
                    id="admin-title-en"
                    placeholder="English title"
                >

                <input
                    id="admin-title-ar"
                    placeholder="Arabic title"
                >

                <textarea
                    id="admin-description-fr"
                    placeholder="French description">
                </textarea>

                <textarea
                    id="admin-description-en"
                    placeholder="English description">
                </textarea>

                <textarea
                    id="admin-description-ar"
                    placeholder="Arabic description">
                </textarea>


                <h3>Colors</h3>

                <label>
                    Main color
                    <input
                        id="admin-color"
                        type="color"
                    >
                </label>


                <button onclick="saveSettings()">
                    💾 Save settings
                </button>


                <h3>Products</h3>

                <div id="admin-products"></div>

                <button onclick="addProduct()">
                    ➕ Add product
                </button>


                <button
                    class="logout"
                    onclick="logout()">
                    Logout
                </button>

            </div>

        </div>

    </div>


    <!-- Firebase -->

    <script type="module" src="app.js"></script>

</body>
</html>
